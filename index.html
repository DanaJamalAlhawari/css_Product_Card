<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Luxury Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<nav class="navbar">

<div class="nav-logo">Luxeshop</div>


    <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>

    </div>


</nav>

<main>










    
    <div class="product-card">
        <!-- src="/img/headphone img.jpg" -->
       <img 
      
        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
      
       alt="wireless headphone" class="product-image">
       
       <span class="discount-badge">-30%

       </span>

    

<div class="product-info">
    <h2>Aria Wireless Headphones</h2> 
    <p>
          Active noise-cancelling, plush earcups, and
        30 hours of battery life on a single charge.
    </p>
</div>
<div class="price">
<span class="current-price">$55.99</span>

<span class="old-price">$79.99</span>
</div>


<div class="product-actions">
    <button class="cart-button">
        Add to Cart
    </button>

    <button class="wishlist-button">
        Add to Wishlist
    </button>

</div>
</div>

<div class="stock-notification">
    <span class="warning-icon">⚠</span>
    Only 3 left in stock
</div>


</main>




</body>

</html>
